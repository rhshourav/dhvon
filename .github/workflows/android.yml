# DHVON CI: builds a debug APK on every push so compile problems surface immediately.
name: Android CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # setup-android v3 installs a legacy "tools" package that Google removed, so
      # every run failed at this step. v4 no longer installs it.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      # Files added through the GitHub web UI can lose their executable bit.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      # The Android Gradle Plugin downloads the exact SDK platform (compileSdk 37)
      # and build-tools it needs, so no manual sdkmanager step is required.
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dhvon-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          if-no-files-found: ignore
