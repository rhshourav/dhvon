# DHVON CI: a compile check that runs ONLY when you start it by hand.
# GitHub -> Actions -> "Android CI" -> "Run workflow".
# Nothing is stored by default: no artifacts and no build cache.
name: Android CI

on:
  workflow_dispatch:
    inputs:
      upload_apk:
        description: 'Keep the debug APKs as a download for 1 day (uses artifact storage)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # setup-android v3 installs a legacy "tools" package that Google removed, so
      # every run failed at this step. v4 no longer installs it.
      - uses: android-actions/setup-android@v4

      # Caching is off, so nothing is saved to your repository's Actions cache.
      # Set cache-disabled to false if you want faster builds and don't mind the cache.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      # Files added through the GitHub web UI can lose their executable bit.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      # Skipped unless you tick "upload_apk" when you run the workflow.
      - name: Keep the APKs for 1 day
        if: ${{ inputs.upload_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: dhvon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
