<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DHVON logo animation</title>
<!-- DHVON logo animation · designed & built by rhshourav · https://github.com/rhshourav/dhvon -->
<style>
:root{--bg:#08090D;--m1:#fff;--m2:#9BA3B4;--e:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:light){:root{--bg:#f5f5f7;--m1:#2b2b33;--m2:#9a9aa8}}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:var(--bg)}
.bars{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.4vw,13px);height:min(30vh,230px)}
.bars i{width:clamp(12px,3vw,28px);height:calc(var(--h)*1%);border-radius:99px;background:linear-gradient(var(--m1),var(--m2));animation:br 2.6s var(--e) infinite;animation-delay:calc(var(--d)*-.35s)}
@keyframes br{50%{transform:scaleY(.6)}}
@media (prefers-reduced-motion:reduce){.bars i{animation:none}}
</style>
</head>
<body>
<div class="bars" role="img" aria-label="DHVON">
<i style="--h:17;--d:5"></i>
<i style="--h:36;--d:3"></i>
<i style="--h:64;--d:1"></i>
<i style="--h:76;--d:0"></i>
<i style="--h:66;--d:2"></i>
<i style="--h:56;--d:4"></i>
<i style="--h:36;--d:6"></i>
<i style="--h:17;--d:7"></i>
</div>
</body>
</html>
